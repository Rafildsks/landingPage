<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Coffee Delivery</title>
    <link rel="stylesheet" href="landingPage.css">
</head>

<body>
    <header>
        <img src="/asset/Logo.svg" alt="logo do café">
        <div class="div-header-right">
            <div class="div-local">
                <img src="/asset/localização.svg" alt="localização">
                <span>Porto Algre, RS</span>
            </div>
            <button class="btn-cart">
                <img src="/asset/carrinhoAmarelo.svg" alt="carrinho de buscar">
            </button>
        </div>
    </header>
    <main class="corpo">
        <section class="section-banner">
            <div class="div-banner">
                <h1 class="titulo-banner">Encontre o café perfeito para qualquer hora do dia</h1>
                <p class="texto-banner">Com o Coffee Delivery você recebe seu café onde estiver, qualquer hora</p>
                <div>
                    <ul class="ul-banner">
                        <li class="lista-banner">
                            <img class="carrinho-banner img-banner" src="./asset/carrinho.svg" alt="icone carrinho">
                            <span>Compra simples e segura</span>
                        </li>
                        <li class="lista-banner">
                            <img class="bloco-banner img-banner" src="./asset/bloco.svg" alt="icone bloco">
                            <span>Embalagem mantém o café intacto</span>
                        </li>
                        <li class="lista-banner">
                            <img class="temporizador-banner img-banner" src="./asset/tempo.svg" alt="icone temporizador">
                            <span>Entrega rápida e rastreada</span>
                        </li>
                        <li class="lista-banner">
                            <img class="cafe.banner img-banner" src="./asset/café.svg" alt="icone cafe">
                            <span>O café chega fresquinho até você</span>
                        </li>
                    </ul>
                </div>
            </div>
            <img src="./asset/copoDoCafe.svg" alt="icone do copo de café">
        </section>
    </main>

</body>

</html>
