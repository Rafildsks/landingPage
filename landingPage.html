<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Delivery</title>
    <link rel="stylesheet" href="landingPage.css">
</head>
<body>
    <header>
        <img src="/asset/Logo.svg" alt="logo do café">
        <div class="div-header-right">
            <div class="div-local">
                <img src="/asset/localização.svg" alt="localização">
                <span>Porto Algre, RS</span>
            </div>
            <button class="btn-cart">
                <img src="/asset/carrinhoAmarelo.svg" alt="carrinho de buscar">
            </button>
        </div>
    </header>
    <main>
        <h1>Encontre o café perfeito para qualquer hora do dia</h1>
        <p>Com o Coffee Delivery você recebe seu café onde estiver, qualquer hora</p>
        <div>
            <img src="/asset/carrinho.svg" alt="">
            <span>Compra simples e segura</span>
        </div>
        <div>
            <img src="/asset/bloco.svg" alt="">
            <span>Embalagem mantém o café intacto</span>
        </div>
        <div>
            <img src="/asset/tempo.svg" alt="">
            <span>Entrega rápida e rastreada</span>
        </div>
        <div>
            <img src="/asset/café.svg" alt="">
            <span>O café chega fresquinho até você </span>
        </div>
    </main>

</body>
</html>
